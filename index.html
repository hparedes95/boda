/* ---------- fanfarrias (una sola vez, sin loop) ---------- */
/* solo:true  -> corta el tema, suena sola, y el tema entra despues
   solo:false -> el tema baja de volumen por debajo y vuelve a subir  */
const JINGLES = {
  ready:    { bpm:170, solo:true,  notes: pat("E5 -  E5 -  E5 -  -  -  C6 -  -  -  -  -  -  -"), bass:'C3' },
  levelup:  { bpm:160, solo:true,  notes: pat("C5 E5 G5 C6 -  E6 -  -  G5 C6 E6 G6 -  -  -  -"), bass:'C3' },
  levelup2: { bpm:160, solo:true,  notes: pat("G5 B5 D6 G6 -  F6 -  -  E6 G6 B6 D7 -  -  -  -"), bass:'G2' },
  family:   { bpm:165, solo:false, notes: pat("E5 G5 C6 -  E6 -  C6 -  G5 -  C6 -  -  -  -  -"), bass:'C3' },
  unlock:   { bpm:150, solo:true,  notes: pat("C5 D5 E5 F5 G5 A5 B5 C6 -  E6 -  G6 -  C7 -  -"), bass:'C2' }
};

/* Dos buses separados: la musica en loop y los efectos/fanfarrias.
   Asi se puede bajar o cortar el loop sin tocar la fanfarria. */
const MUS = { ac:null, master:null, loop:null, fx:null, out:null, noise:null, timer:null,
              step:0, nextT:0, cur:null, playing:false,
              hold:0, pending:null };
let muted = false;

function audioInit(){
  if(MUS.ac) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  MUS.ac = new AC();
  MUS.master = MUS.ac.createGain();
  MUS.master.gain.value = muted ? 0 : .9;
  MUS.master.connect(MUS.ac.destination);
  MUS.loop = MUS.ac.createGain(); MUS.loop.gain.value = 1; MUS.loop.connect(MUS.master);
  MUS.fx   = MUS.ac.createGain(); MUS.fx.gain.value   = 1; MUS.fx.connect(MUS.master);
  MUS.out  = MUS.fx;
  if(!MUS.timer) MUS.timer = setInterval(tick, 20);
  const len = MUS.ac.sampleRate * .5;
  const buf = MUS.ac.createBuffer(1, len, MUS.ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
  MUS.noise = buf;
}
function tone(freq, t, dur, type, vol){
  if(!MUS.ac || !freq) return;
  const o = MUS.ac.createOscillator(), g = MUS.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + .006);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(MUS.out || MUS.master);
  o.start(t); o.stop(t + dur + .02);
}
function noiseHit(t, dur, vol, hp){
  if(!MUS.ac) return;
  const s = MUS.ac.createBufferSource(); s.buffer = MUS.noise;
  const f = MUS.ac.createBiquadFilter(); f.type='highpass'; f.frequency.value = hp;
  const g = MUS.ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(MUS.out || MUS.master);
  s.start(t); s.stop(t + dur + .02);
}
function kickHit(t, hard){
  if(!MUS.ac) return;
  const o = MUS.ac.createOscillator(), g = MUS.ac.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(hard?170:148, t);
  o.frequency.exponentialRampToValueAtTime(44, t + .13);
  g.gain.setValueAtTime(hard?.26:.20, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + .17);
  o.connect(g); g.connect(MUS.out || MUS.master);
  o.start(t); o.stop(t + .19);
}
function playStep(i, t){
  const tr = TRACKS[MUS.cur]; if(!tr) return;
  MUS.out = MUS.loop;
  const v = tr.vol, spb = 60/tr.bpm/4;
  const ln = tr.lead[i];
  if(ln && ln !== '-') tone(ntof(ln), t, spb*1.7, 'square', .055*v);
  const bn = tr.bass[i];
  if(bn && bn !== '-') tone(ntof(bn), t, spb*3.2, 'triangle', .13*v);
  if(tr.arp){ const an = tr.arp[i];
    if(an && an !== '-') tone(ntof(an), t, spb*1.1, 'square', .028*v); }
  if(tr.kick[i]  === 'x') kickHit(t);
  if(tr.snare[i] === 'x') noiseHit(t, .11, .085*v, 1400);
  if(tr.hat[i]   === 'x') noiseHit(t, .035, .026*v, 7000);
}
/* Anticipacion corta: al cortar el loop apenas quedan notas ya programadas. */
function scheduler(){
  if(!MUS.ac || !MUS.playing) return;
  const tr = TRACKS[MUS.cur]; if(!tr) return;
  const spb = 60/tr.bpm/4, len = tr.lead.length;
  while(MUS.nextT < MUS.ac.currentTime + .09){
    playStep(MUS.step % len, Math.max(MUS.nextT, MUS.ac.currentTime));
    MUS.step = (MUS.step + 1) % len;
    MUS.nextT += spb;
  }
}
/* Reloj unico: arranca lo que estuviera en cola y luego programa notas. */
function tick(){
  if(!MUS.ac) return;
  if(MUS.pending && MUS.ac.currentTime >= MUS.hold){
    const n = MUS.pending; MUS.pending = null; loopStart(n);
  }
  scheduler();
}
function loopGain(v, ramp){
  if(!MUS.loop) return;
  const t = MUS.ac.currentTime, g = MUS.loop.gain;
  g.cancelScheduledValues(t);
  g.setValueAtTime(g.value, t);
  g.linearRampToValueAtTime(v, t + (ramp || .12));
}
function loopStart(name){
  if(MUS.cur === name && MUS.playing) return;
  MUS.cur = name; MUS.step = 0;
  MUS.nextT = MUS.ac.currentTime + .05;
  MUS.playing = true;
  if(MUS.loop) MUS.loop.gain.setValueAtTime(0, MUS.ac.currentTime);
  loopGain(1, .30);            // entra con fundido, no de golpe
}
/* Si hay una fanfarria sonando, el tema queda en cola hasta que termine. */
function musicPlay(name){
  audioInit(); if(!MUS.ac || !name) return;
  if(MUS.ac.state === 'suspended') MUS.ac.resume();
  if(MUS.ac.currentTime < MUS.hold){ MUS.pending = name; return; }
  loopStart(name);
}
function musicStop(fade){
  if(!MUS.ac) return;
  MUS.playing = false; MUS.cur = null; MUS.pending = null;
  loopGain(0, fade || .10);
}

/* Duracion real: se ignoran los silencios del final del patron. */
function jingleLen(j){
  let last = 0;
  j.notes.forEach((n,i)=>{ if(n && n !== '-') last = i; });
  return (last + 3) * (60/j.bpm/4);
}
function jingle(name){
  audioInit(); if(!MUS.ac) return;
  if(MUS.ac.state === 'suspended') MUS.ac.resume();
  const j = JINGLES[name]; if(!j) return;
  const spb = 60/j.bpm/4, t0 = MUS.ac.currentTime + .05;
  const dur = jingleLen(j);

  if(j.solo){
    // corta el loop y bloquea cualquier tema hasta que acabe la fanfarria
    MUS.playing = false; MUS.cur = null;
    loopGain(0, .05);
    MUS.hold = t0 + dur + .10;
  } else {
    // momento puntual dentro de un nivel: el tema baja pero no desaparece
    loopGain(.20, .08);
    setTimeout(()=>{ if(MUS.playing) loopGain(1, .40); }, (dur + .05) * 1000);
  }

  MUS.out = MUS.fx;
  j.notes.forEach((n,i)=>{
    if(n && n !== '-'){
      tone(ntof(n),   t0+i*spb, spb*2.4, 'square', .105);
      tone(ntof(n)*2, t0+i*spb, spb*1.2, 'square', .022);
    }
  });
  if(j.bass) for(let i=0;i<4;i++) tone(ntof(j.bass), t0+i*spb*4, spb*3.6, 'triangle', .14);
  [0,4,8,12].forEach(i=>kickHit(t0+i*spb, true));
  [4,12].forEach(i=>noiseHit(t0+i*spb, .13, .10, 1400));
}

function sfx(freqs, dur, type, vol){
  audioInit(); if(!MUS.ac) return;
  MUS.out = MUS.fx;
  freqs.forEach((f,i)=> tone(f, MUS.ac.currentTime + i*.06, dur||.1, type||'square', vol||.06));
}

function spr(sp,x,y,pal,flip){

function caption(list){

let conf=[];
function boom(n,x,y,sp){ for(let i=0;i<n;i++) conf.push({
  x:x+(Math.random()-.5)*(sp||W), y:y+(Math.random()-.5)*20,
  vx:(Math.random()-.5)*70, vy:-Math.random()*100-20,
  c:GC[(Math.random()*GC.length)|0], l:1+Math.random()*2 }); }
function stepConf(dt){
  for(const p of conf){ p.vy+=170*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.l-=dt*.35; }
  conf = conf.filter(p=>p.l>0 && p.y<H+10);

}

  ctx.globalAlpha=Math.min(1,st*2);
  tsh(CONFIG.p1, W/2, 68, '#35d6ff', 18);
  tsh('&', W/2, 100, '#ffd257', 10);
  tsh(CONFIG.p2, W/2, 120, '#ff4fa3', 18);
  tsh(CONFIG.titulo, W/2, 168, '#ffffff', 10);
  tsh(CONFIG.anio + ' - ' + CONFIG.ano, W/2, 192, '#8f7fa8', 8);
  ctx.globalAlpha=1;
}
function drawSelect(){
  vgrad(0,0,W,H,'#231239','#0d0718');
  ctx.strokeStyle='rgba(255,62,165,.18)'; ctx.lineWidth=1;
  const o=(T*22)%26;
  for(let x=-26;x<W+26;x+=26){ ctx.beginPath(); ctx.moveTo(x+o,0); ctx.lineTo(x+o,H); ctx.stroke(); }
  for(let y=-26;y<H+26;y+=26){ ctx.beginPath(); ctx.moveTo(0,y+o); ctx.lineTo(W,y+o); ctx.stroke(); }
  tsh('PERSONAJES', W/2, 16, '#ffffff', 10);
  const boxes=[
    { x:52,  n:CONFIG.p1, s:S_M, p:PM, c:'#35d6ff',
      st:[['RITMO','95'],['INTELIGENTE','99'],['DORMIR','85']] },
    { x:268, n:CONFIG.p2, s:S_F, p:PF, c:'#ff4fa3',
      st:[['RITMO','95'],['PACIENCIA','99'],['CABEZONA','85']] }
  ];
  boxes.forEach((b,i)=>{
    const on = st > 1.2 + i*.9;
    rect(b.x,40,160,190, on?'rgba(0,0,0,.66)':'rgba(0,0,0,.34)');
    ctx.strokeStyle = on?b.c:'#3d2b4a'; ctx.lineWidth=2; ctx.strokeRect(b.x+.5,40.5,159,189);
    ctx.save(); ctx.translate(b.x+80,60); ctx.scale(3,3); spr(b.s,-5,0,b.p); ctx.restore();
    tsh(b.n, b.x+80, 112, b.c, 10);
    b.st.forEach((s,j)=>{
      const y=136+j*22, v=parseInt(s[1],10);
      const grow = on ? Math.min(1,(st-(1.2+i*.9))*1.6) : 0;
      tsh(s[0], b.x+12, y, '#8f7fa8', 7, 'left');
      tsh(on?s[1]:'--', b.x+148, y, '#ffd257', 7, 'right');
      rect(b.x+12,y+11,136,4,'#2a1a3d');
      rect(b.x+12,y+11,136*(v/100)*grow,4,b.c);
    });
    if(st>3.6 && ((T*4)|0)%2===0) tsh('LISTO', b.x+80, 214, '#57d97f', 8);
  });
  tsh('EQUIPO COMPLETO', W/2, 244, '#6f6280', 8);
}
function drawCard(){
  rect(0,0,W,H,'#05030a');
  const s=scene();
  ctx.globalAlpha = Math.min(1,st*3)*Math.min(1,Math.max(0,(s.dur-st)*3));
  tsh(s.a, W/2, 108, '#ffd257', 15);
  tsh(s.b, W/2, 142, '#ffffff', 10);
  ctx.globalAlpha=1;
}
const BTN = { x:150, y:212, w:180, h:26 };
function drawEnd(dt){
  vgrad(0,0,W,H,'#1a0f2e','#43206b');
  ctx.strokeStyle='rgba(255,210,87,.35)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,24);
  for(let x=0;x<=W;x+=10) ctx.lineTo(x,24+Math.sin(x*.03)*6);
  ctx.stroke();
  for(let i=0;i<16;i++) rect(10+i*30, 22+Math.sin(i*.9)*6, 3, 3, GC[i%GC.length]);
  if(st<.7) boom(5,W/2,0,W);
  if(Math.random()<.10) boom(2,Math.random()*W,-6,30);
  ctx.globalAlpha=Math.min(1,st*1.6);
  tsh('NIVEL FINAL', W/2, 40, '#ffd257', 9);
  tsh(CONFIG.p1+'  &  '+CONFIG.p2, W/2, 60, '#ffffff', 13);
  tsh('CON BAUTIZO DE '+CONFIG.p3, W/2, 82, '#57d97f', 8);
  rect(60,100,360,1,'rgba(255,255,255,.28)');
  tsh(CONFIG.dia+' DE '+CONFIG.mes, W/2, 116, '#ff8fc7', 13);
  tsh(CONFIG.ano, W/2, 140, '#ffffff', 15);
  rect(60,166,360,1,'rgba(255,255,255,.28)');
  tsh('TODA LA INFO EN LA WEB', W/2, 178, '#8fd9ff', 8);
  ctx.globalAlpha=1;
  const live = !!CONFIG.web;
  const hot = live && ((T*1.4)|0)%2===0;
  rect(BTN.x-2, BTN.y-2, BTN.w+4, BTN.h+4, hot?'#ffffff':'#5b3a70');
  rect(BTN.x, BTN.y, BTN.w, BTN.h, live?'#ff3ea5':'#3a2b44');
  rect(BTN.x, BTN.y, BTN.w, 2, live?'#ff8fc7':'#4a3a55');
  tsh(live?'VER LA WEB':'WEB PROXIMAMENTE', W/2, BTN.y+9, live?'#ffffff':'#8f7fa8', 8);
  stepConf(dt);
}

/* ---------------- BUCLE ---------------- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,.05);
  T+=dt; if(started || scene().id==='coin') st+=dt;
  ctx.clearRect(0,0,W,H);
  switch(scene().id){
    case 'coin':   drawCoin();   break;
    case 'title':  drawTitle();  break;
    case 'select': drawSelect(); break;
    case 'card':   drawCard();   break;
    case 'l1':     drawL1(dt);   break;
    case 'l2':     drawL2(dt);   break;
    case 'l3':     drawL3(dt);   break;
    case 'end':    drawEnd(dt);  break;
  }
  if(started && st >= scene().dur) next();
  requestAnimationFrame(loop);
}

/* ---------------- INTERACCION ---------------- */
const cab=document.getElementById('cab');
function canvasPos(e){
  const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height };
}
function start(){
  if(started) return;
  started=true; audioInit(); musicPlay('attract'); SFX.coin(); next();
}
cab.addEventListener('click', e=>{
  if(scene().id==='end'){
    const p=canvasPos(e);
    if(CONFIG.web && p.x>BTN.x && p.x<BTN.x+BTN.w && p.y>BTN.y && p.y<BTN.y+BTN.h)
      window.open(CONFIG.web,'_blank','noopener');
    return;
  }
  start();
});
cab.addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); start(); }
});
const webBtn=document.getElementById('web');
if(CONFIG.web) webBtn.href=CONFIG.web;
else { webBtn.textContent='WEB PROXIMAMENTE'; webBtn.setAttribute('aria-disabled','true');
       webBtn.addEventListener('click', e=>e.preventDefault()); }
document.getElementById('again').addEventListener('click', ()=>{
  si=0; st=0; started=false; conf=[]; musicStop(); MUS.hold = 0;
  setTimeout(start, 60);
});
const mb=document.getElementById('mute');
mb.addEventListener('click', ()=>{
  muted=!muted;
  mb.textContent='SONIDO: '+(muted?'OFF':'ON');
  if(MUS.master) MUS.master.gain.value = muted?0:.9;
});
requestAnimationFrame(loop);
cab.focus();
</script>
